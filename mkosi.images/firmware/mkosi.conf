[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
ImageId=uki-rescue-firmware
Output=%i-%v.%a
OutputExtension=sysext.raw
ManifestFormat=json

[Validation]
Verity=no

[Content]
CleanPackageMetadata=yes
BaseTrees=%O/base
WithRecommends=no
WithDocs=no
Packages=
  kernel-firmware-all

[Build]
Environment=SYSTEMD_REPART_OVERRIDE_FSTYPE_ROOT=squashfs
Environment=SYSEXT_SCOPE=system
