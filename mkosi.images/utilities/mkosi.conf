[Config]
Dependencies=base

[Output]
Format=sysext
Overlay=yes
ImageId=uki-rescue-utilities
OutputExtension=sysext.raw
ManifestFormat=json

[Include]
Include=%D/uki-version

[Validation]
Verity=no

[Content]
CleanPackageMetadata=yes
BaseTrees=%O/base
WithRecommends=no
WithDocs=no
Packages=
	lvm2
	pciutils
	usbutils
	wget

[Build]
Environment=SYSTEMD_REPART_OVERRIDE_FSTYPE_ROOT=squashfs
Environment=SYSEXT_SCOPE=system
